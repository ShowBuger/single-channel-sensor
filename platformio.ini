; PlatformIO Project Configuration File
;
; 项目: 单通道磁传感器系统
; MCU: STM32F103C8T6
;
; 使用说明:
; 1. PlatformIO会自动下载ARM工具链和OpenOCD
; 2. 按 Ctrl+Alt+B 编译，Ctrl+Alt+U 上传，F5 调试

[platformio]
description = Single Channel Magnetic Sensor System
default_envs = debug

; ===========================================
; 调试环境 (开发时使用)
; ===========================================
[env:debug]
platform = ststm32
board = genericSTM32F103C8
framework = stm32cube

; 构建类型
build_type = debug

; 编译选项
build_flags =
    ; MCU定义
    -DUSE_STDPERIPH_DRIVER
    -DSTM32F10X_MD
    -DSTM32F103xB

    ; 调试选项
    -DDEBUG
    -Og                     ; 调试优化
    -g3                     ; 最详细调试信息
    -ggdb                   ; GDB调试信息

    ; ARM Cortex-M3选项
    -mcpu=cortex-m3
    -mthumb

    ; 代码生成
    -fdata-sections
    -ffunction-sections
    -fno-common
    -fmessage-length=0

    ; 警告选项
    -Wall
    -Wextra

    ; 链接选项
    -Wl,-Map,${BUILD_DIR}/firmware.map
    -Wl,--gc-sections
    -Wl,--print-memory-usage

    ; 包含路径
    -Ifirmware/src
    -Ifirmware/src/app
    -Ifirmware/src/drivers/bsp
    -Ifirmware/src/drivers/sensors
    -Ifirmware/libs/CMSIS
    -Ifirmware/libs/STM32F10x_StdPeriph_Driver

; 源文件目录
src_dir = firmware/src

; 库文件目录
lib_dir = firmware/libs

; 额外的库依赖目录
lib_extra_dirs =
    firmware/libs/CMSIS
    firmware/libs/STM32F10x_StdPeriph_Driver

; 链接脚本
board_build.ldscript = firmware/STM32F103C8Tx_FLASH.ld

; 上传配置
upload_protocol = stlink

; 调试配置
debug_tool = stlink
debug_init_break = tbreak main
debug_load_mode = modified

; 串口监视器
monitor_speed = 115200
monitor_filters =
    default
    time
    colorize

; CPU频率
board_build.f_cpu = 72000000L

; ===========================================
; 发布环境 (生产时使用)
; ===========================================
[env:release]
platform = ststm32
board = genericSTM32F103C8
framework = stm32cube

build_type = release

build_flags =
    -DUSE_STDPERIPH_DRIVER
    -DSTM32F10X_MD
    -DSTM32F103xB
    -DNDEBUG
    -Os
    -flto
    -mcpu=cortex-m3
    -mthumb
    -fdata-sections
    -ffunction-sections
    -Wl,-Map,${BUILD_DIR}/firmware.map
    -Wl,--gc-sections
    -Ifirmware/src
    -Ifirmware/src/app
    -Ifirmware/src/drivers/bsp
    -Ifirmware/src/drivers/sensors
    -Ifirmware/libs/CMSIS
    -Ifirmware/libs/STM32F10x_StdPeriph_Driver

src_dir = firmware/src
lib_dir = firmware/libs
lib_extra_dirs =
    firmware/libs/CMSIS
    firmware/libs/STM32F10x_StdPeriph_Driver

board_build.ldscript = firmware/STM32F103C8Tx_FLASH.ld
upload_protocol = stlink
monitor_speed = 115200
board_build.f_cpu = 72000000L
